name: build-apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # the run number is the app's versionCode, so every build counts as newer than the previous one
      - run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: usbcam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # publish the APK as a GitHub Release: the app checks these for updates. A failure here must not fail the build.
      - name: Publish release for in-app updates
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VNAME=$(grep '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '\r')
          cp app/build/outputs/apk/debug/*.apk usbcam.apk
          gh release create "build-${{ github.run_number }}" usbcam.apk --title "UsbCam $VNAME (build ${{ github.run_number }})" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}" --latest
