name: build-obs-plugin
on: [push, workflow_dispatch]
jobs:
  obs:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OBS_TAG: "33.0.3"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Fetch OBS headers, simde, OBS release (for obs.dll), FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch $env:OBS_TAG --filter=blob:none --sparse https://github.com/obsproject/obs-studio obs
          git -C obs sparse-checkout set libobs deps/w32-pthreads
          git clone --depth 1 https://github.com/simd-everywhere/simde simde
          $asset = gh release view $env:OBS_TAG -R obsproject/obs-studio --json assets -q '.assets[].name' | Where-Object { $_ -match 'Windows-x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'no Windows-x64.zip asset in the OBS release' }
          Write-Host "OBS asset: $asset"
          gh release download $env:OBS_TAG -R obsproject/obs-studio -p $asset -O obs-win.zip
          Expand-Archive obs-win.zip -DestinationPath obs-win
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath deps
          Write-Host "OBS ships these FFmpeg DLLs (must NOT share a name with ours):"
          Get-ChildItem obs-win -Recurse -Filter 'avcodec-*.dll' | ForEach-Object { $_.Name }
          Write-Host "ours:"; Get-ChildItem deps -Recurse -Filter 'avcodec-*.dll' | ForEach-Object { $_.Name }
      - name: Make obs.lib from obs.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Get-ChildItem obs-win -Recurse -Filter obs.dll | Where-Object { $_.FullName -match '64bit' } | Select-Object -First 1).FullName
          Write-Host "obs.dll: $dll"
          $names = dumpbin /exports $dll | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] } }
          if ($names.Count -lt 500) { throw "only $($names.Count) exports found in obs.dll" }
          Write-Host "exports: $($names.Count)"
          "LIBRARY obs`nEXPORTS`n" + ($names -join "`n") | Out-File obs.def -Encoding ascii
          lib /nologo /def:obs.def /out:obs.lib /machine:x64
          if ($LASTEXITCODE -ne 0) { throw 'lib failed' }
          # obsconfig.h is generated by OBS's own CMake; libobs only needs these names
          New-Item -ItemType Directory stub | Out-Null
          Set-Content stub/obsconfig.h "#pragma once`n#define OBS_INSTALL_PREFIX `"`"`n#define OBS_DATA_PATH `"data`"`n#define OBS_PLUGIN_DESTINATION `"plugins`""
      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ff = ((Get-ChildItem deps -Directory -Filter 'ffmpeg-*').FullName) -replace '\\','/'
          $w = (Get-Location).Path -replace '\\','/'
          cmake -S pc-obs -B build-obs -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release "-DOBS_SRC=$w/obs" "-DOBS_LIB=$w/obs.lib" "-DOBS_STUB=$w/stub" "-DSIMDE_DIR=$w/simde" "-DPTHREAD_DIR=$w/obs/deps/w32-pthreads" "-DFFMPEG_DIR=$ff"
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build-obs
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }
          $out = 'out/usbcam-obs/bin/64bit'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build-obs/usbcam-obs.dll $out
          Copy-Item "$ff/bin/avcodec-*.dll","$ff/bin/avutil-*.dll","$ff/bin/swresample-*.dll" $out
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: usbcam-obs-plugin
          path: out
