name: build-vcam
on: [push, workflow_dispatch]
jobs:
  vcam:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FFmpeg 8.1 (LGPL shared), SDL2 and Dear ImGui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip" -OutFile ff.zip
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip" -OutFile sdl.zip
          Invoke-WebRequest "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.9.zip" -OutFile imgui.zip
          Expand-Archive ff.zip -DestinationPath deps
          Expand-Archive sdl.zip -DestinationPath deps
          Expand-Archive imgui.zip -DestinationPath deps
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ff = ((Get-ChildItem deps -Directory -Filter 'ffmpeg-*').FullName) -replace '\\','/'
          $sdl = ((Get-ChildItem deps -Directory -Filter 'SDL2-*').FullName) -replace '\\','/'
          $imgui = ((Get-ChildItem deps -Directory -Filter 'imgui-*').FullName) -replace '\\','/'
          cmake -S pc-vcam -B build-vcam -A x64 "-DFFMPEG_DIR=$ff" "-DSDL2_DIR=$sdl" "-DIMGUI_DIR=$imgui"
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build-vcam --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build-vcam/Release/usbcam_vcam.exe out/
          Copy-Item build-vcam/Release/usbcam_vcam_src.dll out/
          Copy-Item build-vcam/Release/UsbCam.exe out/
          Copy-Item "$sdl/lib/x64/SDL2.dll" out/
          Copy-Item "$ff/bin/avcodec-*.dll","$ff/bin/avutil-*.dll","$ff/bin/swresample-*.dll" out/
          Copy-Item pc/vcam-install.ps1, pc/vcam-uninstall.ps1 out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: usbcam-vcam
          path: out
